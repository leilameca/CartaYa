<!doctype html>
<html lang="es">
  <body style="margin:0;background:#f8f9fa;font-family:Arial,sans-serif;color:#1a2530">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#fff;border-radius:16px;padding:32px;border:1px solid #e8eaed">
          <tr><td>
            <p style="margin:0 0 8px;color:#00a86b;font-size:14px;font-weight:700">CARTAYA</p>
            <h1 style="margin:0 0 12px;font-size:24px">Recupera tu contraseña</h1>
            <p style="margin:0 0 24px;line-height:1.6">Usa este código de seguridad para elegir una contraseña nueva:</p>
            <p style="margin:0 0 24px;padding:18px;border-radius:12px;background:#f8f9fa;color:#1a2530;font-size:32px;font-weight:800;letter-spacing:10px;text-align:center">{{ .Token }}</p>
            <p style="margin:0;color:#667085;font-size:13px;line-height:1.5">El código vence en 60 minutos. Si no solicitaste el cambio, no compartas este código y puedes ignorar el mensaje.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
